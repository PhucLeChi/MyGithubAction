# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "dev" branch
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  PROJECT_TARGET_NAME: 'Dfin.RightProspectus.CommandCenter.Funds.Web'
  
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Set variables 001
        shell: pwsh
        run: |
          echo "MYTOKEN1=${{ github.ref_name }}" >> $env:GITHUB_ENV

      - name: Set variables 002
        shell: pwsh
        run: |
          echo "MYTOKEN2=${{ github.ref_name }}" >> $env:GITHUB_ENV
          
      - name: Set variables
        shell: pwsh
        id: first_step
        run: |
          myMask=${{ env.MYTOKEN1 }}
          echo "::add-mask::$myMask"
          echo "myMask=$myMask" >> $env:GITHUB_ENV

      - name: Show log
        shell: pwsh
        run: |
          echo "This is test name '${{ env.PROJECT_TARGET_NAME }}'"
          echo "This is test aaaa '${{ env.MYTOKEN1 }}'"
          echo "This is test bbbb '${{ env.MYTOKEN2 }}'"
