name: 'Hello World'
description: 'Greet someone'

outputs:
  build_number:
    description: "Random number"
    value: ${{ steps.build_number.outputs.myMask }}
  build_number2:
    description: "Random number"
    value: ${{ steps.build_number2.outputs.buildNumber }}

runs:
  using: "composite"
  steps:
    - name: Set variables
      id: build_number
      shell: bash
      run: |
        $myMask="$(date +'%Y.%m.%d').${{ github.run_number }}"
        echo "$myMask"
        echo "::add-mask::$myMask"
        echo "myMask=$myMask" >> $GITHUB_OUTPUT

    - name: Get Build Number
      id: build_number2
      shell: bash
      run: echo "buildNumber=$(date +'%Y.%m.%d').${{ github.run_number }}" >> $GITHUB_OUTPUT

